<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Bez spojení · OPSYS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #16171a;
        --muted: #5b5e68;
        --line: #d9dae0;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131417;
          --fg: #ececef;
          --muted: #a0a3ad;
          --line: #2f3037;
          --accent: #6d9bff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.25rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.875rem;
        color: var(--fg);
      }
      button {
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Jen ke čtení</span>
      <h1>Bez spojení</h1>
      <p>
        Tuto stránku jste v telefonu ještě neotevřeli, takže ji teď nemáme uloženou. Stránky, které
        jste už viděli, jdou číst i bez signálu; změny se bez spojení neukládají.
      </p>
      <button type="button" onclick="location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
